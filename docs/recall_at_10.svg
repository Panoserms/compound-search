<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-label="Recall at 10 of the ten tested systems on the 1,025 test questions">
<style>
  text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1b1c; }
  .title { font-size: 17px; font-weight: 700; }
  .group { font-size: 12px; fill: #555b63; }
  .label { font-size: 13px; }
  .value { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tick { font-size: 11px; fill: #555b63; }
  .frame { fill: #ffffff; stroke: #1a1b1c; stroke-width: 4; }
  .head { fill: #e3e7eb; }
  .rule { stroke: #1a1b1c; stroke-width: 4; }
  .grid { stroke: #d5dbe1; stroke-width: 1; }
  .ci { stroke: #9aa3ac; stroke-width: 3; stroke-linecap: round; }
  .dot { fill: #1a1b1c; }
  .hi { fill: #ff5f14; }
</style>
<rect class="frame" x="2" y="2" width="856" height="516"/>
<rect class="head" x="4" y="4" width="852" height="52"/>
<line class="rule" x1="2" y1="58" x2="858" y2="58"/>
<text class="title" x="16" y="36">Recall@10 on the 1,025 held-out test questions, with 95% intervals</text>
<line class="grid" x1="372.0" y1="74" x2="372.0" y2="470"/>
<text class="tick" x="372.0" y="488" text-anchor="middle">60%</text>
<line class="grid" x1="472.0" y1="74" x2="472.0" y2="470"/>
<text class="tick" x="472.0" y="488" text-anchor="middle">70%</text>
<line class="grid" x1="572.0" y1="74" x2="572.0" y2="470"/>
<text class="tick" x="572.0" y="488" text-anchor="middle">80%</text>
<line class="grid" x1="672.0" y1="74" x2="672.0" y2="470"/>
<text class="tick" x="672.0" y="488" text-anchor="middle">90%</text>
<line class="grid" x1="772.0" y1="74" x2="772.0" y2="470"/>
<text class="tick" x="772.0" y="488" text-anchor="middle">100%</text>
<text class="tick" x="16" y="488">The axis starts at 60%.</text>
<text class="group" x="16" y="94">Keyword search only (BM25)</text>
<text class="label" x="16" y="125.5">BM25 on plain words (baseline)</text>
<line class="ci" x1="440.0" y1="121.0" x2="519.1" y2="121.0"/>
<circle class="dot" cx="480.3" cy="121.0" r="6"/>
<text class="value" x="844" y="125.5" text-anchor="end">70.8%</text>
<text class="label" x="16" y="155.5">BM25 on stems</text>
<line class="ci" x1="506.1" y1="151.0" x2="580.4" y2="151.0"/>
<circle class="dot" cx="543.7" cy="151.0" r="6"/>
<text class="value" x="844" y="155.5" text-anchor="end">77.2%</text>
<text class="label" x="16" y="185.5">BM25 on stems + compound parts, whole word kept</text>
<line class="ci" x1="541.4" y1="181.0" x2="611.6" y2="181.0"/>
<circle class="dot" cx="576.9" cy="181.0" r="6"/>
<text class="value" x="844" y="185.5" text-anchor="end">80.5%</text>
<text class="label" x="16" y="215.5">BM25 on stems, compounds replaced by their parts</text>
<line class="ci" x1="549.8" y1="211.0" x2="620.4" y2="211.0"/>
<circle class="dot hi" cx="585.7" cy="211.0" r="6"/>
<text class="value" x="844" y="215.5" text-anchor="end">81.4%</text>
<text class="group" x="16" y="246">Dense model only</text>
<text class="label" x="16" y="277.5">Dense model alone (multilingual-e5-small)</text>
<line class="ci" x1="676.0" y1="273.0" x2="714.1" y2="273.0"/>
<circle class="dot" cx="695.9" cy="273.0" r="6"/>
<text class="value" x="844" y="277.5" text-anchor="end">92.4%</text>
<text class="group" x="16" y="308">Both, fused</text>
<text class="label" x="16" y="339.5">Hybrid: plain BM25 + dense</text>
<line class="ci" x1="633.4" y1="335.0" x2="686.2" y2="335.0"/>
<circle class="dot" cx="660.8" cy="335.0" r="6"/>
<text class="value" x="844" y="339.5" text-anchor="end">88.9%</text>
<text class="label" x="16" y="369.5">Hybrid: stemmed BM25 + dense</text>
<line class="ci" x1="660.5" y1="365.0" x2="706.1" y2="365.0"/>
<circle class="dot" cx="684.2" cy="365.0" r="6"/>
<text class="value" x="844" y="369.5" text-anchor="end">91.2%</text>
<text class="label" x="16" y="399.5">Hybrid: stems + parts (whole kept) + dense</text>
<line class="ci" x1="671.5" y1="395.0" x2="712.7" y2="395.0"/>
<circle class="dot" cx="693.0" cy="395.0" r="6"/>
<text class="value" x="844" y="399.5" text-anchor="end">92.1%</text>
<text class="label" x="16" y="429.5">Hybrid: stems + parts (replaced) + dense</text>
<line class="ci" x1="673.7" y1="425.0" x2="716.0" y2="425.0"/>
<circle class="dot hi" cx="695.9" cy="425.0" r="6"/>
<text class="value" x="844" y="429.5" text-anchor="end">92.4%</text>
<text class="label" x="16" y="459.5">Hybrid + LLM rewriting of unsure queries</text>
<line class="ci" x1="683.0" y1="455.0" x2="722.8" y2="455.0"/>
<circle class="dot" cx="703.7" cy="455.0" r="6"/>
<text class="value" x="844" y="459.5" text-anchor="end">93.2%</text>
</svg>
