<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 476" width="860" height="476" role="img" aria-label="Recall at 10 of the ten tested systems on the 1,025 test questions">
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .title { font-size: 14px; font-weight: 600; }
  .group { font-size: 12px; fill: #59636e; }
  .label { font-size: 13px; }
  .value { font-size: 13px; font-variant-numeric: tabular-nums; }
  .tick { font-size: 11px; fill: #59636e; }
  .grid { stroke: #d1d9e0; stroke-width: 1; }
  .ci { stroke: #59636e; stroke-width: 2; stroke-linecap: round; }
  .dot { fill: #1f2328; }
  @media (prefers-color-scheme: dark) {
    text { fill: #f0f6fc; }
    .group, .tick { fill: #9198a1; }
    .grid { stroke: #3d444d; }
    .ci { stroke: #9198a1; }
    .dot { fill: #f0f6fc; }
  }
</style>
<text class="title" x="16" y="24">Recall@10 on the 1,025 held-out test questions, with 95% intervals</text>
<line class="grid" x1="372.0" y1="46" x2="372.0" y2="436"/>
<text class="tick" x="372.0" y="454" text-anchor="middle">60%</text>
<line class="grid" x1="472.0" y1="46" x2="472.0" y2="436"/>
<text class="tick" x="472.0" y="454" text-anchor="middle">70%</text>
<line class="grid" x1="572.0" y1="46" x2="572.0" y2="436"/>
<text class="tick" x="572.0" y="454" text-anchor="middle">80%</text>
<line class="grid" x1="672.0" y1="46" x2="672.0" y2="436"/>
<text class="tick" x="672.0" y="454" text-anchor="middle">90%</text>
<line class="grid" x1="772.0" y1="46" x2="772.0" y2="436"/>
<text class="tick" x="772.0" y="454" text-anchor="middle">100%</text>
<text class="tick" x="16" y="454">The axis starts at 60%.</text>
<text class="group" x="16" y="66">Keyword search only (BM25)</text>
<text class="label" x="16" y="95.5">BM25 on plain words (baseline)</text>
<line class="ci" x1="440.0" y1="91.0" x2="519.1" y2="91.0"/>
<circle class="dot" cx="480.3" cy="91.0" r="5"/>
<text class="value" x="844" y="95.5" text-anchor="end">70.8%</text>
<text class="label" x="16" y="125.5">BM25 on stems</text>
<line class="ci" x1="506.1" y1="121.0" x2="580.4" y2="121.0"/>
<circle class="dot" cx="543.7" cy="121.0" r="5"/>
<text class="value" x="844" y="125.5" text-anchor="end">77.2%</text>
<text class="label" x="16" y="155.5">BM25 on stems + compound parts, whole word kept</text>
<line class="ci" x1="541.4" y1="151.0" x2="611.6" y2="151.0"/>
<circle class="dot" cx="576.9" cy="151.0" r="5"/>
<text class="value" x="844" y="155.5" text-anchor="end">80.5%</text>
<text class="label" x="16" y="185.5">BM25 on stems, compounds replaced by their parts</text>
<line class="ci" x1="549.8" y1="181.0" x2="620.4" y2="181.0"/>
<circle class="dot" cx="585.7" cy="181.0" r="5"/>
<text class="value" x="844" y="185.5" text-anchor="end">81.4%</text>
<text class="group" x="16" y="216">Dense model only</text>
<text class="label" x="16" y="245.5">Dense model alone (multilingual-e5-small)</text>
<line class="ci" x1="676.0" y1="241.0" x2="714.1" y2="241.0"/>
<circle class="dot" cx="695.9" cy="241.0" r="5"/>
<text class="value" x="844" y="245.5" text-anchor="end">92.4%</text>
<text class="group" x="16" y="276">Both, fused</text>
<text class="label" x="16" y="305.5">Hybrid: plain BM25 + dense</text>
<line class="ci" x1="633.4" y1="301.0" x2="686.2" y2="301.0"/>
<circle class="dot" cx="660.8" cy="301.0" r="5"/>
<text class="value" x="844" y="305.5" text-anchor="end">88.9%</text>
<text class="label" x="16" y="335.5">Hybrid: stemmed BM25 + dense</text>
<line class="ci" x1="660.5" y1="331.0" x2="706.1" y2="331.0"/>
<circle class="dot" cx="684.2" cy="331.0" r="5"/>
<text class="value" x="844" y="335.5" text-anchor="end">91.2%</text>
<text class="label" x="16" y="365.5">Hybrid: stems + parts (whole kept) + dense</text>
<line class="ci" x1="671.5" y1="361.0" x2="712.7" y2="361.0"/>
<circle class="dot" cx="693.0" cy="361.0" r="5"/>
<text class="value" x="844" y="365.5" text-anchor="end">92.1%</text>
<text class="label" x="16" y="395.5">Hybrid: stems + parts (replaced) + dense</text>
<line class="ci" x1="673.7" y1="391.0" x2="716.0" y2="391.0"/>
<circle class="dot" cx="695.9" cy="391.0" r="5"/>
<text class="value" x="844" y="395.5" text-anchor="end">92.4%</text>
<text class="label" x="16" y="425.5">Hybrid + LLM rewriting of unsure queries</text>
<line class="ci" x1="683.0" y1="421.0" x2="722.8" y2="421.0"/>
<circle class="dot" cx="703.7" cy="421.0" r="5"/>
<text class="value" x="844" y="425.5" text-anchor="end">93.2%</text>
</svg>
